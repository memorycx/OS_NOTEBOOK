name: Build slide data

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/slides/**"
      - "**/index.html"

permissions:
  contents: write

concurrency:
  group: build-slides
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild slide data
        run: node tools/build-slides.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: rebuild slide data"
            git push
          fi
